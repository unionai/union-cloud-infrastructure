AWSTemplateFormatVersion: 2010-09-09
Parameters:
  CACertificate:
    Description: PEM-encoded X.509 root CA certificate for Union's CA.
    Type: String
  TrustAnchorName:
    Type: String
    Default: union-trust-anchor
  ProfileDeployName:
    Type: String
    Default: union-deploy
  ProfileBreakGlassName:
    Type: String
    Default: union-break-glass
  RoleDeployName:
    Type: String
    Default: union-deploy
  RoleBreakGlassName:
    Type: String
    Default: union-break-glass
Resources:
  TrustAnchor:
    Type: AWS::RolesAnywhere::TrustAnchor
    Properties:
      Name: !Ref TrustAnchorName
      Enabled: true
      Source:
        SourceType: CERTIFICATE_BUNDLE
        SourceData:
          X509CertificateData: !Ref CACertificate
  DeployProfile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Ref ProfileDeployName
      Enabled: true
      AcceptRoleSessionName: true
      DurationSeconds: 3600
      RoleArns:
        - !GetAtt UnionDeployRole.Arn
  BreakGlassProfile:
    Type: AWS::RolesAnywhere::Profile
    Properties:
      Name: !Ref ProfileBreakGlassName
      Enabled: false
      DurationSeconds: 3600
      RoleArns:
        - !GetAtt UnionBreakGlassRole.Arn
  UnionDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleDeployName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              StringEquals:
                aws:SourceArn: !GetAtt TrustAnchor.TrustAnchorArn
                aws:PrincipalTag/x509Subject/CN: union-deploy
  UnionBreakGlassRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleBreakGlassName
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: rolesanywhere.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
              - sts:SetSourceIdentity
            Condition:
              StringEquals:
                aws:SourceArn: !GetAtt TrustAnchor.TrustAnchorArn
                aws:PrincipalTag/x509Subject/CN: union-break-glass
      Policies:
        - PolicyName: BreakGlassClusterDescribe
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/*'

  EKSUpgradeReadPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      Description: Read EKS upgrade readiness, update history, capacity and public AMI metadata
      Roles: [!Ref UnionDeployRole]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ReadEKSUpgradeInsights
            Effect: Allow
            Action:
              - eks:ListInsights
              - eks:DescribeInsight
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/union-*'
          - Sid: ReadEKSUpgradeUpdates
            Effect: Allow
            Action:
              - eks:ListUpdates
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/union-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/union-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/union-*'
          - Sid: ReadEKSUpgradeCatalogAndCapacity
            Effect: Allow
            Action:
              - eks:DescribeAddonVersions
              - ec2:DescribeInstances
              - ec2:DescribeCapacityReservations
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          - Sid: ReadEKSOptimizedAMIs
            Effect: Allow
            Action:
              - ssm:GetParameters
            Resource:
              - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/eks/optimized-ami/*'
  CrossAccountPolicyForAWSTrustedAdvisorUnion:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: UnionIAMPolicy
      Roles: [!Ref UnionDeployRole]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:ListTagsLogGroup'
              - 'logs:TagLogGroup'
              - 'logs:UntagLogGroup'
              - 'logs:DescribeLogGroups'
              - 'logs:DeleteLogGroup'
              - 'eks:CreateNodegroup'
              - 'logs:CreateLogGroup'
              - 'eks:DeleteCluster'
              - 'kms:CreateAlias'
              - 'eks:DescribeCluster'
              - 'logs:PutRetentionPolicy'
              - 'kms:DeleteAlias'
            Resource:
              - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:opta-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group::log-stream*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/opta-*:*'
          - Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:GetQueueAttributes
              - sqs:ListQueueTags
            Effect: Allow
            Resource:
              - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:Karpenter*'
          - Action:
              - events:DescribeRule
              - events:DeleteRule
              - events:ListTargetsByRule
              - events:ListTagsForResource
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
              - events:TagResource
              - events:UntagResource
            Effect: Allow
            Resource:
              - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/Karpenter*'
          - Effect: Allow
            Action:
              - 'eks:CreateAccessEntry'
              - 'eks:DescribeAccessEntry'
              - 'eks:UpdateAccessEntry'
              - 'eks:DeleteAccessEntry'
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
          - Effect: Allow
            Action:
              - 'kms:EnableKeyRotation'
              - 'kms:PutKeyPolicy'
              - 'kms:GetKeyPolicy'
              - 'ec2:AttachInternetGateway'
              - 'kms:ListResourceTags'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'ec2:DetachInternetGateway'
              - 'eks:DescribeNodegroup'
              - 'kms:GetKeyRotationStatus'
              - 'eks:DeleteNodegroup'
              - 'ec2:CreateInternetGateway'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:CreateAlias'
              - 'kms:DescribeKey'
              - 'ec2:DeleteInternetGateway'
              - 'kms:DeleteAlias'
              - 'kms:CreateGrant'
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:internet-gateway/*'
              - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          - Effect: Allow
            Action:
              - 'ec2:CreateRoute'
              - 'ec2:DeleteRoute'
              - 'ec2:CreateRouteTable'
              - 'ec2:DeleteRouteTable'
              - 'ec2:AssociateRouteTable'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/subnet-*'
          - Effect: Allow
            Action:
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:CreateSecurityGroup'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:DeleteSecurityGroup'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group-rule/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/vpc-*'
          - Effect: Allow
            Action:
              - 'ec2:DeleteSubnet'
              - 'ec2:CreateNatGateway'
              - 'ec2:DeleteNatGateway'
              - 'ec2:CreateSubnet'
              - 'ec2:ModifySubnetAttribute'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:natgateway/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/eipalloc-*'
          - Effect: Allow
            Action:
              - 'ec2:DeleteFlowLogs'
              - 'ec2:CreateFlowLogs'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-flow-log/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/vpc*'
          - Effect: Allow
            Action:
              - 'ec2:CreateVpc'
              - 'ec2:CreateRouteTable'
              - 'ec2:AttachInternetGateway'
              - 'ec2:ModifyVpcAttribute'
              - 'ec2:DetachInternetGateway'
              - 'ec2:DeleteVpc'
              - 'ec2:CreateSubnet'
              - 'ec2:DescribeVpcAttribute'
              - 'ec2:AssociateVpcCidrBlock'
              - 'ec2:DisassociateVpcCidrBlock'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'
          - Effect: Allow
            Action:
              - 'iam:DeleteOpenIDConnectProvider'
              - 'iam:GetOpenIDConnectProvider'
              - 'iam:CreateOpenIDConnectProvider'
              - 'iam:TagOpenIDConnectProvider'
              - 'iam:UntagOpenIDConnectProvider'
              - 'iam:ListOpenIDConnectProviderTags'
              - 'iam:UpdateOpenIDConnectProviderThumbprint'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/*'
          - Effect: Allow
            Action:
              - 'iam:CreatePolicy'
              - 'iam:CreatePolicyVersion'
              - 'iam:DeletePolicyVersion'
              - 'iam:GetPolicyVersion'
              - 'iam:GetPolicy'
              - 'iam:ListPolicyVersions'
              - 'iam:DeletePolicy'
              - 'iam:ListPolicyTags'
              - 'iam:TagPolicy'
              - 'iam:UntagPolicy'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*'
          - Effect: Allow
            Action:
              - 'iam:GetRole'
              - 'iam:TagRole'
              - 'iam:UntagRole'
              - 'iam:ListRoleTags'
              - 'iam:CreateRole'
              - 'iam:DeleteRole'
              - 'iam:AttachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:ListInstanceProfilesForRole'
              - 'iam:PassRole'
              - 'iam:CreateServiceLinkedRole'
              - 'iam:DetachRolePolicy'
              - 'iam:ListAttachedRolePolicies'
              - 'iam:DeleteRolePolicy'
              - 'iam:ListRolePolicies'
              - 'iam:GetRolePolicy'
              - 'iam:UpdateAssumeRolePolicy'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
          - Effect: Allow
            Action:
              - 'ec2:DescribeAddresses'
              - 'ec2:EnableEbsEncryptionByDefault'
              - 'ec2:GetEbsEncryptionByDefault'
              - 'ec2:DescribeFlowLogs'
              - 'ec2:ResetEbsDefaultKmsKeyId'
              - 'ec2:DescribeInternetGateways'
              - 'ec2:DescribeNetworkInterfaces'
              - 'ec2:DescribeAvailabilityZones'
              - 'ec2:GetEbsDefaultKmsKeyId'
              - 'ec2:DescribeAccountAttributes'
              - 'kms:CreateKey'
              - 'ec2:DescribeNetworkAcls'
              - 'ec2:DescribeRouteTables'
              - 'ec2:ModifyEbsDefaultKmsKeyId'
              - 'eks:CreateCluster'
              - 'eks:UpdateClusterVersion'
              - 'eks:UpdateClusterConfig'
              - 'ec2:ReleaseAddress'
              - 'ec2:DescribeVpcClassicLinkDnsSupport'
              - 'ec2:DescribeNatGateways'
              - 'ec2:DisassociateRouteTable'
              - 'ec2:DescribeSecurityGroups'
              - 'ec2:DescribeVpcClassicLink'
              - 'ec2:DescribeVpcs'
              - 'kms:ListAliases'
              - 'ec2:DisableEbsEncryptionByDefault'
              - 'sts:GetCallerIdentity'
              - 'ec2:DescribeSubnets'
              - 'ec2:DescribeSecurityGroupRules'
              - 'ec2:AllocateAddress'
              - 'ec2:AssociateAddress'
              - 'ec2:DisassociateAddress'
              - 'ec2:DescribeAddressesAttribute'
              - 'ec2:DescribeInstanceTypeOfferings'
              - 'logs:DescribeLogStreams'
              - 'iam:ListRoles'
              - 'iam:ListPolicies'
              - 'ec2:DescribeInstanceTypes'
              - 'servicequotas:GetServiceQuota'
              - 'cloudwatch:GetMetricStatistics'
              - 'ec2:RunInstances'
              - 'ec2:CreateTags'
              - 'ec2:DescribeTags'
              - 'ec2:DeleteTags'
              - 'ec2:DescribeImages'
              - 'ec2:CreateLaunchTemplate'
              - 'ec2:CreateLaunchTemplateVersion'
              - 'ec2:DescribeLaunchTemplates'
              - 'ec2:DescribeLaunchTemplateVersions'
              - 'ec2:DeleteLaunchTemplate'
              - 'ec2:DeleteLaunchTemplateVersions'
              - 'ec2:ModifyLaunchTemplate'
              - 'autoscaling:CreateAutoScalingGroup'
              - 'autoscaling:DeleteAutoScalingGroup'
              - 'autoscaling:DescribeAutoScalingGroups'
              - 'autoscaling:UpdateAutoScalingGroup'
              - 'autoscaling:CreateLaunchConfiguration'
              - 'autoscaling:SetInstanceProtection'
              - 'autoscaling:DescribeScalingActivities'
              - 'autoscaling:CreateOrUpdateTags'
              - 'autoscaling:DescribeTags'
              - 'autoscaling:DeleteTags'
              - 'ec2:DescribeVpcEndpoints'
              - 'ec2:DescribePrefixLists'
              - 'ecr:GetAuthorizationToken'
            Resource: '*'
          - Effect: Allow
            Action: 'dynamodb:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/opta-*'
          - Effect: Allow
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::opta-*'
              - !Sub 'arn:${AWS::Partition}:s3:::opta-*/'
              - !Sub 'arn:${AWS::Partition}:s3:::union-*'
              - !Sub 'arn:${AWS::Partition}:s3:::union-*/'
          - Effect: Allow
            Action:
              - 'elasticache:CreateCacheSubnetGroup'
              - 'elasticache:AddTagsToResource'
              - 'elasticache:RemoveTagsFromResource'
              - 'elasticache:ListTagsForResource'
              - 'elasticache:DescribeCacheSubnetGroups'
              - 'elasticache:DeleteCacheSubnetGroup'
            Resource:
              - !Sub 'arn:${AWS::Partition}:elasticache:${AWS::Region}:${AWS::AccountId}:subnetgroup:opta-*'
          - Effect: Allow
            Action:
              - 'iam:CreateInstanceProfile'
              - 'iam:AddRoleToInstanceProfile'
              - 'iam:RemoveRoleFromInstanceProfile'
              - 'iam:DeleteInstanceProfile'
              - 'iam:TagInstanceProfile'
              - 'iam:UntagInstanceProfile'
              - 'iam:ListInstanceProfileTags'
              - 'iam:GetInstanceProfile'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*'
          - Effect: Allow
            Action:
              - 'eks:UpdateNodegroupConfig'
              - 'eks:ListNodegroups'
              - 'eks:UpdateNodegroupVersion'
              - 'eks:TagResource'
              - 'eks:UntagResource'
              - 'eks:ListTagsForResource'
              - 'eks:DescribeUpdate'
              - 'eks:DeleteNodegroup'
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/union-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/union-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/union-*'
          - Effect: Allow
            Action:
              - 'eks:CreateAddon'
              - 'eks:UpdateAddon'
              - 'eks:DeleteAddon'
              - 'eks:DescribeAddonVersions'
              - 'eks:DescribeAddon'
              - 'eks:ListAddons'
            Resource:
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/opta-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/union-*'
              - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/union-*'
          - Effect: Allow
            Action:
              - 'ec2:CreateVpcEndpoint'
              - 'ec2:ModifyVpcEndpoint'
              - 'ec2:DeleteVpcEndpoints'
            Resource:
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/vpc*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc-endpoint/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*'
              - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
          - Effect: Allow
            Action:
              - logs:GetLogEvents
              - logs:FilterLogEvents
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/opta-*:log-stream:kube-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/union/cluster-*/*:log-stream:*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/containerinsights/opta-*/application:log-stream:fluentbit-kube.var.log.containers.*'
          - Effect: Allow
            Action:
              - ecr:CreateRepository
              - ecr:DeleteRepository
              - ecr:TagResource
              - ecr:UntagResource
              - ecr:PutLifecyclePolicy
              - ecr:DeleteLifecyclePolicy
              - ecr:PutImageTagMutability
              - ecr:PutImageScanningConfiguration
              - ecr:BatchDeleteImage
              - ecr:DeleteRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:GetRepositoryPolicy
              - ecr:PutReplicationConfiguration
              - ecr:DescribeRepositories
              - ecr:ListTagsForResource
              - ecr:GetLifecyclePolicy
              - ecr:DescribeImages
            Resource:
              - !Sub 'arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/union/*'
          # ECR pull-through cache rules. These actions have no resource type.
          - Effect: Allow
            Action:
              - ecr:CreatePullThroughCacheRule
              - ecr:DescribePullThroughCacheRules
              - ecr:UpdatePullThroughCacheRule
              - ecr:DeletePullThroughCacheRule
            Resource: '*'